version: 1.3.{build}
image: Visual Studio 2022
configuration: Release
before_build:
  - nuget restore
build:
  project: .\ZWaveLib.sln
  verbosity: minimal
test:
  assemblies:
    only:
      - ZWaveLib.Tests/bin/Debug/ZWaveLib.Tests.dll
after_test:
  - ps: .\ZWaveLib\nuget_pack.ps1
artifacts:
  - path: '*.nupkg'
    name: ZWaveLib nupkg
deploy:
  - provider: GitHub
    auth_token:
      secure: QJoBiqbeg1z+3WRoH1IdXRsnXtvwS95U2Z89JH9DrnEhJYMYbRpKjUmGEbOU3OnDLFz8gKqzP8y7KpL226lCb/Y+W6CTt7EGouenMIKnzZBllZVvSG73LdhHgD8RbxIy
    draft: false
    prerelease: false
    on:
      appveyor_repo_tag: true
  - provider: NuGet
    api_key:
      secure: VLSz2Mm3RJU7/uhvY1kOSfewPUL43YB7sxMOadvqUyrIFcU2DV2S84mtuySIJJX0
    skip_symbols: false
    artifact: /.*\.nupkg/
    on:
      appveyor_repo_tag: true
